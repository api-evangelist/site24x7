openapi: 3.0.3
info:
  title: Site24x7 REST API
  description: >-
    The Site24x7 REST API (v2.0) enables programmatic access to all monitoring
    operations including creating and managing monitors for websites, servers,
    cloud resources, APIs, and databases; configuring alert thresholds,
    notification profiles, and on-call schedules; scheduling maintenance
    windows; retrieving availability, performance, and SLA reports; managing
    IT automation actions; and administering users, groups, and third-party
    integrations. Authentication uses OAuth 2.0 via the Zoho Developer Console.
  version: "2.0"
  contact:
    name: Site24x7 Support
    url: https://www.site24x7.com/contact.html
  termsOfService: https://www.site24x7.com/terms.html
  license:
    name: Site24x7 Terms of Service
    url: https://www.site24x7.com/terms.html
externalDocs:
  description: Site24x7 API Documentation
  url: https://www.site24x7.com/help/api/

servers:
  - url: https://www.site24x7.com/api
    description: US data center
  - url: https://www.site24x7.eu/api
    description: EU data center
  - url: https://www.site24x7.in/api
    description: India data center
  - url: https://www.site24x7.net.au/api
    description: Australia data center
  - url: https://app.site24x7.jp/api
    description: Japan data center
  - url: https://www.site24x7.ca/api
    description: Canada data center
  - url: https://app.site24x7.uk/api
    description: UK data center
  - url: https://app.site24x7.ae/api
    description: UAE data center
  - url: https://www.site24x7.sa/api
    description: Saudi Arabia data center

security:
  - ZohoOAuth: []

tags:
  - name: Monitors
    description: Create, retrieve, update, and delete monitors of all types
  - name: Monitor Groups
    description: Organize monitors into logical groups
  - name: Current Status
    description: Real-time status and health information
  - name: Reports
    description: Availability, performance, SLA, and custom reports
  - name: Outages
    description: Outage records and incident management
  - name: Alarms
    description: Alert and alarm management
  - name: Users
    description: User account administration
  - name: Notification Profiles
    description: Alert notification configuration
  - name: Threshold Profiles
    description: Performance threshold configuration
  - name: Maintenance Windows
    description: Scheduled maintenance management
  - name: Tags
    description: Tag-based monitor organization

paths:
  # ──────────────────────────────────────────────────────────────────────────────
  # Monitors
  # ──────────────────────────────────────────────────────────────────────────────
  /monitors:
    get:
      operationId: listMonitors
      tags: [Monitors]
      summary: List all monitors
      description: Retrieve a list of all monitors configured in the account.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: List of monitors returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMonitor
      tags: [Monitors]
      summary: Create a monitor
      description: Create a new monitor. The monitor type is determined by the `type` field in the request body.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
      responses:
        "200":
          description: Monitor created successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /monitors/{monitor_id}:
    get:
      operationId: getMonitor
      tags: [Monitors]
      summary: Get a monitor
      description: Retrieve the configuration and details of a specific monitor by its ID.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor details returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMonitor
      tags: [Monitors]
      summary: Update a monitor
      description: Modify the configuration of an existing monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
      responses:
        "200":
          description: Monitor updated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMonitor
      tags: [Monitors]
      summary: Delete a monitor
      description: Permanently remove a monitor from the account.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor deleted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/name/{display_name}:
    get:
      operationId: getMonitorByName
      tags: [Monitors]
      summary: Get a monitor by name
      description: Retrieve monitor details using the monitor's display name.
      parameters:
        - name: display_name
          in: path
          required: true
          schema:
            type: string
          description: Display name of the monitor
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMonitorByName
      tags: [Monitors]
      summary: Delete a monitor by name
      description: Remove a monitor using its display name.
      parameters:
        - name: display_name
          in: path
          required: true
          schema:
            type: string
          description: Display name of the monitor
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor deleted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/activate:
    put:
      operationId: activateMonitor
      tags: [Monitors]
      summary: Activate a monitor
      description: Re-enable a previously suspended monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor activated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/suspend:
    put:
      operationId: suspendMonitor
      tags: [Monitors]
      summary: Suspend a monitor
      description: Pause monitoring operations for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor suspended successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/poll:
    post:
      operationId: pollMonitor
      tags: [Monitors]
      summary: Poll a monitor immediately
      description: Initiate an immediate check for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Poll initiated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/polling_status:
    get:
      operationId: getMonitorPollingStatus
      tags: [Monitors]
      summary: Get polling status
      description: Retrieve the current polling status for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Polling status returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/mute:
    put:
      operationId: muteMonitor
      tags: [Monitors]
      summary: Mute a monitor
      description: Silence alert notifications for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor muted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/unmute:
    put:
      operationId: unmuteMonitor
      tags: [Monitors]
      summary: Unmute a monitor
      description: Resume alert notifications for a previously muted monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor unmuted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitors/{monitor_id}/monitor_groups:
    get:
      operationId: getMonitorGroups
      tags: [Monitor Groups]
      summary: Get monitor groups for a monitor
      description: Retrieve all monitor groups that a specific monitor belongs to.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor groups returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorGroupListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMonitorGroupAssignments
      tags: [Monitor Groups]
      summary: Update monitor group assignments
      description: Update which monitor groups a specific monitor belongs to.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              type: object
              properties:
                group_ids:
                  type: array
                  items:
                    type: string
                  description: List of monitor group IDs
      responses:
        "200":
          description: Monitor group assignments updated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────────
  # Monitor Groups
  # ──────────────────────────────────────────────────────────────────────────────
  /monitor_groups:
    get:
      operationId: listMonitorGroups
      tags: [Monitor Groups]
      summary: List all monitor groups
      description: Retrieve all monitor groups configured in the account.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor groups returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorGroupListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMonitorGroup
      tags: [Monitor Groups]
      summary: Create a monitor group
      description: Create a new monitor group to organize related monitors.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/MonitorGroupCreate'
      responses:
        "200":
          description: Monitor group created successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorGroupResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /monitor_groups/{group_id}:
    get:
      operationId: getMonitorGroup
      tags: [Monitor Groups]
      summary: Get a monitor group
      description: Retrieve details of a specific monitor group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor group returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorGroupResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMonitorGroup
      tags: [Monitor Groups]
      summary: Update a monitor group
      description: Modify the configuration of an existing monitor group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/MonitorGroupCreate'
      responses:
        "200":
          description: Monitor group updated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/MonitorGroupResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMonitorGroup
      tags: [Monitor Groups]
      summary: Delete a monitor group
      description: Permanently remove a monitor group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor group deleted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitor_groups/{group_id}/status:
    get:
      operationId: getMonitorGroupStatus
      tags: [Current Status]
      summary: Get monitor group status
      description: Retrieve the aggregated real-time status of all monitors in a group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Group status returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /monitor_groups/{group_id}/status/count:
    get:
      operationId: getMonitorGroupStatusCount
      tags: [Current Status]
      summary: Get monitor status count in a group
      description: Count monitors by status (Up, Down, Trouble, Critical) within a specific group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Status counts returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusCountResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────────
  # Current Status
  # ──────────────────────────────────────────────────────────────────────────────
  /monitors/{monitor_id}/status:
    get:
      operationId: getMonitorStatus
      tags: [Current Status]
      summary: Get current monitor status
      description: Retrieve the real-time status of a specific monitor.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Monitor status returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /status/monitor_type/{type}:
    get:
      operationId: getStatusByMonitorType
      tags: [Current Status]
      summary: Get status by monitor type
      description: Retrieve status information filtered by a specific monitor type.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: Monitor type identifier (e.g., URL, SERVER, SSL_CERT)
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Status by monitor type returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /status/count:
    get:
      operationId: getStatusCount
      tags: [Current Status]
      summary: Get monitor status counts
      description: Get counts of monitors grouped by status (Up, Down, Trouble, Critical, Suspended, Maintenance).
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Status counts returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusCountResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /status/monitor_type/count:
    get:
      operationId: getStatusCountByMonitorType
      tags: [Current Status]
      summary: Get status counts by monitor type
      description: Retrieve status counts grouped by monitor type.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Status counts by type returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/StatusCountResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────────────────────────────────────
  # Reports
  # ──────────────────────────────────────────────────────────────────────────────
  /reports/summary:
    get:
      operationId: getSummaryReport
      tags: [Reports]
      summary: Get summary report by monitor
      description: Retrieve a summary report for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/MonitorIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Summary report returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/summary/group:
    get:
      operationId: getSummaryReportByGroup
      tags: [Reports]
      summary: Get summary report by monitor group
      description: Retrieve a summary report aggregated by monitor group.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/GroupIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Summary report by group returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/summary/all:
    get:
      operationId: getSummaryReportAll
      tags: [Reports]
      summary: Get summary report for all monitors
      description: Retrieve a summary report covering all monitors.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Summary report for all monitors returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/availability:
    get:
      operationId: getAvailabilityReport
      tags: [Reports]
      summary: Get availability report
      description: Retrieve an availability report for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/MonitorIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Availability report returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/availability/all:
    get:
      operationId: getAvailabilityReportAll
      tags: [Reports]
      summary: Get availability report for all monitors
      description: Retrieve availability data covering all monitors.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Availability report for all monitors returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/performance:
    get:
      operationId: getPerformanceReport
      tags: [Reports]
      summary: Get performance report
      description: Retrieve a performance report for a specific monitor.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/MonitorIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: Performance report returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/sla:
    get:
      operationId: getSlaReport
      tags: [Reports]
      summary: Get SLA report
      description: Retrieve SLA compliance reports.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/MonitorIdQuery'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        "200":
          description: SLA report returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/custom:
    post:
      operationId: createCustomReport
      tags: [Reports]
      summary: Create a custom report
      description: Generate a custom report with specified parameters.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              type: object
              properties:
                monitor_ids:
                  type: array
                  items:
                    type: string
                  description: List of monitor IDs to include
                start_date:
                  type: string
                  format: date-time
                  description: Report start date/time
                end_date:
                  type: string
                  format: date-time
                  description: Report end date/time
                report_type:
                  type: string
                  description: Type of custom report to generate
      responses:
        "200":
          description: Custom report created successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/health_trend:
    get:
      operationId: getHealthTrendReport
      tags: [Reports]
      summary: Get health trend report
      description: Retrieve health trend data for a monitor.
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/MonitorIdQuery'
