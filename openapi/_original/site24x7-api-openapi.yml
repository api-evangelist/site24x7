        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        "200":
          description: Tag created successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/TagResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /tags/{tag_id}:
    get:
      operationId: getTag
      tags: [Tags]
      summary: Get a tag
      description: Retrieve details of a specific tag.
      parameters:
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
          description: Unique tag identifier
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Tag returned successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/TagResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTag
      tags: [Tags]
      summary: Update a tag
      description: Modify an existing tag.
      parameters:
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
          description: Unique tag identifier
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json;version=2.0:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        "200":
          description: Tag updated successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/TagResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Delete a tag
      description: Remove a tag from the account.
      parameters:
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
          description: Unique tag identifier
        - $ref: '#/components/parameters/ApiVersionHeader'
      responses:
        "200":
          description: Tag deleted successfully
          content:
            application/json;version=2.0:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ZohoOAuth:
      type: http
      scheme: bearer
      bearerFormat: Zoho-oauthtoken
      description: >-
        OAuth 2.0 token obtained from the Zoho Developer Console.
        Pass as `Authorization: Zoho-oauthtoken {access_token}`.

  parameters:
    MonitorId:
      name: monitor_id
      in: path
      required: true
      schema:
        type: string
      description: Unique monitor identifier
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
      description: Unique monitor group identifier
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
      description: Unique profile identifier
    ApiVersionHeader:
      name: Accept
      in: header
      required: false
      schema:
        type: string
        default: "application/json; version=2.0"
      description: API version header. Defaults to version 2.0.
    MonitorIdQuery:
      name: monitor_id
      in: query
      required: false
      schema:
        type: string
      description: Filter by monitor ID
    GroupIdQuery:
      name: group_id
      in: query
      required: false
      schema:
        type: string
      description: Filter by monitor group ID
    StartDate:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Start of the time range (ISO 8601)
    EndDate:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: End of the time range (ISO 8601)

  responses:
    Unauthorized:
      description: Authentication failed or token is missing
      content:
        application/json;version=2.0:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json;version=2.0:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found
      content:
        application/json;version=2.0:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: Response code (0 = success)
          example: 0
        message:
          type: string
          description: Response message
          example: success
      required: [code, message]

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error description
        error_info:
          type: string
          description: Additional error details

    Monitor:
      type: object
      properties:
        monitor_id:
          type: string
          description: Unique identifier for the monitor
        display_name:
          type: string
          description: Human-readable name of the monitor
        type:
          type: string
          description: Monitor type (e.g., URL, SERVER, SSL_CERT, REST_API)
          example: URL
        website:
          type: string
          format: uri
          description: URL being monitored (for website monitors)
        check_frequency:
          type: integer
          description: Check interval in minutes
          example: 5
        location_profile_id:
          type: string
          description: ID of the location profile used for checks
        notification_profile_id:
          type: string
          description: ID of the notification profile
        threshold_profile_id:
          type: string
          description: ID of the threshold profile
        monitor_groups:
          type: array
          items:
            type: string
          description: List of monitor group IDs this monitor belongs to
        tag_ids:
          type: array
          items:
            type: string
          description: List of tag IDs associated with this monitor
        status:
          type: integer
          description: Current status (0=Down, 1=Up, 2=Trouble, 3=Critical, 5=Suspended, 7=Maintenance)
          enum: [0, 1, 2, 3, 5, 7]
        created_time:
          type: string
          format: date-time
          description: Timestamp when the monitor was created
        last_polled_time:
          type: string
          format: date-time
          description: Timestamp of the last polling check

    MonitorCreate:
      type: object
      required: [display_name, type]
      properties:
        display_name:
          type: string
          description: Human-readable name for the monitor
          example: My Website Monitor
        type:
          type: string
          description: Monitor type identifier
          example: URL
        website:
          type: string
          format: uri
          description: URL to monitor (for website/API monitors)
          example: https://example.com
        check_frequency:
          type: integer
          description: Polling interval in minutes
          default: 5
          example: 5
        location_profile_id:
          type: string
          description: ID of the location profile for check locations
        notification_profile_id:
          type: string
          description: ID of the notification profile for alerts
        threshold_profile_id:
          type: string
          description: ID of the threshold profile for alerting criteria
        monitor_groups:
          type: array
          items:
            type: string
          description: Monitor group IDs to assign this monitor to
        tag_ids:
          type: array
          items:
            type: string
          description: Tag IDs to associate with this monitor
        timeout:
          type: integer
          description: Request timeout in seconds
          default: 10

    MonitorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Monitor'

    MonitorListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Monitor'

    MonitorGroup:
      type: object
      properties:
        group_id:
          type: string
          description: Unique identifier for the monitor group
        display_name:
          type: string
          description: Human-readable name of the monitor group
        description:
          type: string
          description: Description of the monitor group
        monitors:
          type: array
          items:
            type: string
          description: List of monitor IDs in this group
        health_threshold_count:
          type: integer
          description: Number of monitors that must be down to mark group as down

    MonitorGroupCreate:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          description: Name for the monitor group
          example: Production Servers
        description:
          type: string
          description: Description of the monitor group
        monitors:
          type: array
          items:
            type: string
          description: Monitor IDs to include in this group
        health_threshold_count:
          type: integer
          description: Number of monitors that must be down to alert

    MonitorGroupResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MonitorGroup'

    MonitorGroupListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MonitorGroup'

    StatusInfo:
      type: object
      properties:
        monitor_id:
          type: string
          description: Monitor identifier
        display_name:
          type: string
          description: Monitor display name
        type:
          type: string
          description: Monitor type
        status:
          type: integer
          description: Current status code (0=Down, 1=Up, 2=Trouble, 3=Critical, 5=Suspended, 7=Maintenance)
          enum: [0, 1, 2, 3, 5, 7]
        last_polled_time:
          type: string
          format: date-time
          description: Time of the last polling check
        unit:
          type: string
          description: Performance metric unit
        response_time:
          type: number
          description: Latest response time in milliseconds

    StatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StatusInfo'

    StatusCountResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                up:
                  type: integer
                  description: Number of monitors currently up
                down:
                  type: integer
                  description: Number of monitors currently down
                trouble:
                  type: integer
                  description: Number of monitors in trouble state
                critical:
                  type: integer
                  description: Number of monitors in critical state
                suspended:
                  type: integer
                  description: Number of suspended monitors
                maintenance:
                  type: integer
                  description: Number of monitors in maintenance

    ReportData:
      type: object
      properties:
        monitor_id:
          type: string
          description: Monitor identifier
        display_name:
          type: string
          description: Monitor display name
        availability:
          type: number
          format: float
          description: Availability percentage
          example: 99.95
        downtime:
          type: number
          format: float
          description: Total downtime in minutes
        response_time:
          type: number
          format: float
          description: Average response time in milliseconds
        start_date:
          type: string
          format: date-time
          description: Report period start
        end_date:
          type: string
          format: date-time
          description: Report period end

    ReportResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/ReportData'
                - type: array
                  items:
                    $ref: '#/components/schemas/ReportData'

    Outage:
      type: object
      properties:
        outage_id:
          type: string
          description: Unique outage identifier
        monitor_id:
          type: string
          description: Associated monitor identifier
        display_name:
          type: string
          description: Monitor display name
        type:
          type: string
          description: Monitor type
        down_time:
          type: string
          format: date-time
          description: Time the outage started
        up_time:
          type: string
          format: date-time
          description: Time the outage ended (null if ongoing)
        duration:
          type: integer
          description: Outage duration in seconds
        reason:
          type: string
          description: Reason for the outage

    OutageCreate:
      type: object
      required: [monitor_id]
      properties:
        monitor_id:
          type: string
          description: Monitor ID for which to create the outage
        display_name:
          type: string
          description: Monitor display name (alternative to monitor_id)
        down_time:
          type: string
          format: date-time
          description: Outage start time
        up_time:
          type: string
          format: date-time
          description: Outage end time
        reason:
          type: string
          description: Reason for the outage

    OutageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Outage'

    OutageListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Outage'

    Comment:
      type: object
      properties:
        comment_id:
          type: string
          description: Unique comment identifier
        outage_id:
          type: string
          description: Associated outage identifier
        comment:
          type: string
          description: Comment text
        created_by:
          type: string
          description: User who created the comment
        created_time:
          type: string
          format: date-time
          description: Comment creation timestamp

    CommentCreate:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          description: Comment text
          example: Investigating the root cause of this outage

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Comment'

    CommentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Comment'

    Alarm:
      type: object
      properties:
        alarm_id:
          type: string
          description: Unique alarm identifier
        monitor_id:
          type: string
          description: Associated monitor identifier
        display_name:
          type: string
          description: Monitor display name
        alarm_time:
          type: string
          format: date-time
          description: Time the alarm was triggered
        alarm_type:
          type: string
          description: Type of alarm (e.g., DOWN, TROUBLE, CRITICAL)
        status:
          type: integer
          description: Alarm status
        reason:
          type: string
          description: Reason for the alarm

    AlarmListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Alarm'

    User:
      type: object
      properties:
        user_id:
          type: string
          description: Unique user identifier
        display_name:
          type: string
          description: User's display name
        email_address:
          type: array
          items:
            type: string
            format: email
          description: List of email addresses for the user
        mobile_sms:
          type: array
          items:
            type: string
          description: List of mobile numbers for SMS alerts
        role:
          type: integer
          description: User role (0=Super Admin, 1=Admin, 2=Operator, 3=Read Only)
          enum: [0, 1, 2, 3]
        notify_via:
          type: array
          items:
            type: integer
          description: Notification channels (1=Email, 2=SMS, 3=Voice, 4=IM)

    UserCreate:
      type: object
      required: [display_name, email_address, role]
      properties:
        display_name:
          type: string
          description: User's display name
          example: John Doe
        email_address:
          type: array
          items:
            type: string
            format: email
          description: Email addresses for the user
        mobile_sms:
          type: array
          items:
            type: string
          description: Mobile phone numbers for SMS alerts
        role:
          type: integer
          description: User role
          enum: [0, 1, 2, 3]
          example: 2
        notify_via:
          type: array
          items:
            type: integer
          description: Notification method codes

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    NotificationProfile:
      type: object
      properties:
        profile_id:
          type: string
          description: Unique profile identifier
        profile_name:
          type: string
          description: Name of the notification profile
        notify_after_down_count:
          type: integer
          description: Number of consecutive failures before alerting
        notify_after_consecutive_count:
          type: integer
          description: Number of consecutive checks before sending notifications
        escalation_wait_time:
          type: integer
          description: Time in minutes before escalating alerts
        escalation_prefix:
          type: string
          description: Prefix added to escalated notifications
        escalation_user_group_id:
          type: string
          description: User group to notify during escalation
        is_default:
          type: boolean
          description: Whether this is the default notification profile

    NotificationProfileCreate:
      type: object
      required: [profile_name]
      properties:
        profile_name:
          type: string
          description: Name for the notification profile
          example: Critical Alerts Profile
        notify_after_down_count:
          type: integer
          description: Failures before alerting
          default: 1
        notify_after_consecutive_count:
          type: integer
          description: Consecutive checks before notification
          default: 1
        escalation_wait_time:
          type: integer
          description: Minutes before escalating
          default: 0
        escalation_prefix:
          type: string
          description: Prefix for escalated alerts
        escalation_user_group_id:
          type: string
          description: User group for escalation

    NotificationProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NotificationProfile'

    NotificationProfileListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationProfile'

    ThresholdProfile:
      type: object
      properties:
        profile_id:
          type: string
          description: Unique threshold profile identifier
        profile_name:
          type: string
          description: Name of the threshold profile
        type:
          type: string
          description: Monitor type this profile applies to
        is_default:
          type: boolean
          description: Whether this is the default threshold profile
        trouble_threshold:
          type: integer
          description: Response time threshold for TROUBLE status (milliseconds)
        critical_threshold:
          type: integer
          description: Response time threshold for CRITICAL status (milliseconds)
        down_threshold:
          type: integer
          description: Consecutive failures before marking as DOWN

    ThresholdProfileCreate:
      type: object
      required: [profile_name, type]
      properties:
        profile_name:
          type: string
          description: Name for the threshold profile
          example: Website Thresholds
        type:
          type: string
          description: Monitor type this profile applies to
          example: URL
        trouble_threshold:
          type: integer
          description: Response time for TROUBLE alert (ms)
          example: 3000
        critical_threshold:
          type: integer
          description: Response time for CRITICAL alert (ms)
          example: 5000
        down_threshold:
          type: integer
          description: Consecutive failures before DOWN alert
          example: 1

    ThresholdProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ThresholdProfile'

    ThresholdProfileListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ThresholdProfile'

    MaintenanceWindow:
      type: object
      properties:
        maintenance_id:
          type: string
          description: Unique maintenance window identifier
        display_name:
          type: string
          description: Name of the maintenance window
        description:
          type: string
          description: Description of the maintenance activity
        maintenance_type:
          type: integer
          description: Schedule type (1=Once, 2=Daily, 3=Weekly, 4=Monthly)
          enum: [1, 2, 3, 4]
        start_date:
          type: string
          description: Start date of the maintenance window
        end_date:
          type: string
          description: End date of the maintenance window
        start_time:
          type: string
          description: Start time in HH:MM format
        end_time:
          type: string
          description: End time in HH:MM format
        monitors:
          type: array
          items:
            type: string
          description: Monitor IDs in the maintenance window
        perform_actions:
          type: boolean
          description: Whether automated actions should run during maintenance

    MaintenanceWindowCreate:
      type: object
      required: [display_name, maintenance_type, start_date, end_date, start_time, end_time]
      properties:
        display_name:
          type: string
          description: Name for the maintenance window
          example: Monthly Patching
        description:
          type: string
          description: Maintenance description
        maintenance_type:
          type: integer
          description: Schedule recurrence (1=Once, 2=Daily, 3=Weekly, 4=Monthly)
          enum: [1, 2, 3, 4]
          example: 1
        start_date:
          type: string
          description: Maintenance start date (YYYY-MM-DD)
          example: "2026-07-01"
        end_date:
          type: string
          description: Maintenance end date (YYYY-MM-DD)
          example: "2026-07-01"
        start_time:
          type: string
          description: Start time (HH:MM)
          example: "02:00"
        end_time:
          type: string
          description: End time (HH:MM)
          example: "04:00"
        monitors:
          type: array
          items:
            type: string
          description: Monitor IDs to include in maintenance
        perform_actions:
          type: boolean
          description: Allow automated actions during maintenance
          default: false

    MaintenanceWindowResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MaintenanceWindow'

    MaintenanceWindowListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceWindow'

    Tag:
      type: object
      properties:
        tag_id:
          type: string
          description: Unique tag identifier
        tag_name:
          type: string
          description: Tag name
        tag_color:
          type: string
          description: Tag color in hex format
          example: "#FF0000"

    TagCreate:
      type: object
      required: [tag_name]
      properties:
        tag_name:
          type: string
          description: Name for the tag
          example: production
        tag_color:
          type: string
          description: Color for the tag (hex)
          example: "#4CAF50"

    TagResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Tag'

    TagListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
