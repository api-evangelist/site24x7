apis:
  - aid: site24x7:site24x7-api
    name: Site24x7 REST API
    description: >-
      The Site24x7 REST API (v2.0) enables programmatic access to all monitoring
      operations including creating and managing monitors for websites, servers,
      cloud resources, APIs, and databases; configuring alert thresholds,
      notification profiles, and on-call schedules; scheduling maintenance windows;
      retrieving availability, performance, and SLA reports; managing IT automation
      actions; and administering users, groups, and third-party integrations.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
