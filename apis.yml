aid: site24x7
name: Site24x7
description: >-
  Site24x7 is a full-stack cloud monitoring platform with a REST API for managing
  monitors, on-call schedules, alerts, SLAs, and accessing availability and
  performance metrics. The platform covers website uptime, server infrastructure,
  cloud services (AWS, Azure, GCP), application performance (APM), real user
  monitoring (RUM), network devices, databases, and synthetic transactions. The
  API uses OAuth 2.0 via the Zoho Developer Console and supports multiple regional
  data centers across the US, EU, India, Australia, Japan, Canada, UK, UAE, and
  Saudi Arabia.
